<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gun Rex</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1b1a3a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gun Rex">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#14122b;--ink:#ffefd0;--coral:#ff6b5b;--gold:#ffd166;--sky:#6ec6ff;box-sizing:border-box;color-scheme:dark;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overscroll-behavior:none;overflow:hidden;
font-family:'Silkscreen',ui-monospace,Menlo,monospace;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:8px}
canvas{width:min(100%,calc((100dvh - 150px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))*1.7778));
aspect-ratio:16/9;border-radius:14px;image-rendering:pixelated;background:#222}
.pad{display:flex;gap:12px;width:min(100%,640px)}
.pad button{flex:1;height:84px;border:0;border-radius:18px;font:700 clamp(12px,3.6vw,20px) 'Silkscreen',monospace;color:#14122b;letter-spacing:0}
#jump{background:var(--gold)}#duck{background:var(--sky)}#shoot{background:var(--coral)}
#shopbtn{background:#b8a1ff;flex:.75;display:none}#shopbtn.show{display:block}
#shop{position:fixed;inset:0;z-index:20;background:rgba(20,18,43,.97);display:none;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 14px);overflow-y:auto;touch-action:pan-y}
#shop.open{display:flex}
#code{width:100%;box-sizing:border-box;height:70px;margin:6px 0;border-radius:10px;border:0;padding:8px;background:#241e49;color:var(--ink);font:11px ui-monospace,Menlo,monospace;-webkit-user-select:text;user-select:text;resize:none}
.row{display:flex;gap:8px;flex-shrink:0;margin-bottom:14px}.row button{flex:1;height:44px;border:0;border-radius:12px;font:700 12px 'Silkscreen',monospace;background:#b8a1ff;color:#14122b}.gh,.gm,.card{flex-shrink:0}
.gh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;font-size:16px}
.gh button{height:40px;padding:0 14px;border:0;border-radius:12px;font:700 13px 'Silkscreen',monospace;background:#ffefd0;color:#14122b}
.gm{color:var(--coral);font-size:12px;margin-bottom:8px}.sec{flex-shrink:0;color:var(--gold);font-size:13px;margin:6px 0 8px}
.card{background:#241e49;border-radius:16px;padding:12px;margin-bottom:10px;display:flex;gap:10px;align-items:center}
.card.eq{outline:3px solid var(--gold)}.card .i{flex:1;min-width:0}.card b{font-size:16px;display:block;margin-bottom:4px}.card small{font-size:11px;opacity:.85;line-height:1.5}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:8px;vertical-align:-1px;border:2px solid rgba(255,255,255,.35)}
.card button{min-width:96px;height:46px;border:0;border-radius:12px;font:700 12px 'Silkscreen',monospace;background:var(--gold);color:#14122b}.card button:disabled{opacity:.45}
.pad button:active,.pad button.on{transform:scale(.97);filter:brightness(.88)}
.pad button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#rot{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:20px}
#rot .ph{width:64px;height:112px;border:5px solid var(--gold);border-radius:14px;animation:rotph 2.4s ease-in-out infinite}
#rot b{font-size:20px;color:var(--gold)}#rot small{font-size:12px;opacity:.85}
@keyframes rotph{0%,25%{transform:rotate(0)}65%,100%{transform:rotate(-90deg)}}
@media (pointer:coarse){
 body{padding:0;gap:0}
 canvas{width:min(calc(100vw - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)),calc((100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))*1.7778));border-radius:0}
 .pad{position:fixed;inset:0;width:auto;display:block;pointer-events:none;z-index:5}
 .pad button{position:absolute;pointer-events:auto;flex:none;width:112px;height:64px;font-size:14px;opacity:.55;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);touch-action:none}
 #duck{left:calc(env(safe-area-inset-left,0px) + 12px)}
 #jump{left:calc(env(safe-area-inset-left,0px) + 134px)}
 #shoot{right:calc(env(safe-area-inset-right,0px) + 12px);width:136px;height:78px}
 #shopbtn{left:50%;margin-left:-42px;width:84px;height:38px;font-size:11px;opacity:.5}
}
@media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}
</style>
</head>
<body>
<canvas id="c" width="640" height="360" aria-label="Gun Rex game"></canvas>
<div class="pad"><button id="duck">DUCK</button><button id="jump">JUMP</button><button id="shoot">SHOOT</button><button id="shopbtn">SHOP</button></div>
<div id="shop"></div>
<div id="rot"><div class="ph"></div><b>ROTATE YOUR PHONE</b><small>GUN REX PLAYS IN LANDSCAPE</small></div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),W=640,H=360,GY=300;
const FONT="'Silkscreen',monospace";
const GUNS=[
{n:'PISTOL',price:0,cool:.14,max:6,regen:1.1,dmg:1,pel:1,sp:0,pier:0,v:900,life:2,col:'#8d99ae',len:24,bc:'#ffd166',d:'STARTER. 6 AMMO, SLOW RELOAD'},
{n:'SMG',price:80,cool:.07,max:14,regen:2.2,dmg:1,pel:1,sp:0,pier:0,v:1000,life:2,col:'#5bc0be',len:28,bc:'#9bf6ff',d:'RAPID FIRE. 14 AMMO, FAST RELOAD'},
{n:'SHOTGUN',price:160,cool:.45,max:8,regen:1.2,dmg:1,pel:3,sp:16,pier:0,v:850,life:.62,col:'#c77d3a',len:30,bc:'#ffb86b',d:'3 PELLETS, MEDIUM RANGE. HITS BOSSES HARD'},
{n:'RIFLE',price:260,cool:.28,max:8,regen:1.5,dmg:3,pel:1,sp:0,pier:2,v:1300,life:2,col:'#6a994e',len:34,bc:'#caffbf',d:'3 DAMAGE. PIERCES 2 ENEMIES'},
{n:'PLASMA',price:500,cool:.16,max:14,regen:2.2,dmg:3,pel:1,sp:0,pier:99,v:1100,life:2,col:'#7b2cbf',len:32,big:1,bc:'#e0aaff',d:'3 DAMAGE. PIERCES EVERYTHING. BIG BEAM'},
{n:'AWM',price:900,cool:.85,max:5,regen:.7,dmg:8,pel:1,sp:0,pier:3,v:2000,life:2,col:'#3a5a40',len:42,bc:'#ffffff',d:'8 DAMAGE. PIERCES 3 ENEMIES. 5 AMMO, SLOW SHOT'}];
const ARMORS=[
{n:'NO ARMOR',price:0,hits:0,col:'#8d99ae',d:'NOTHING BETWEEN YOU AND THE BULLETS'},
{n:'LEATHER',price:100,hits:1,col:'#a47148',d:'BLOCKS 1 HIT EACH RUN'},
{n:'IRON',price:220,hits:2,col:'#9aa5b1',d:'BLOCKS 2 HITS EACH RUN'},
{n:'STEEL',price:400,hits:3,col:'#5bc0be',d:'BLOCKS 3 HITS EACH RUN'},
{n:'DRAGON',price:700,hits:4,col:'#e63946',d:'BLOCKS 4 HITS EACH RUN'}];
const save=(()=>{const d={bank:0,gun:0,own:[1,0,0,0,0,0],armor:0,aown:[1,0,0,0,0],skin:0,sown:[1,0,0,0,0,0,0,0],pet:0,pown:[1,0,0,0,0]};try{return Object.assign(d,JSON.parse(localStorage.getItem('gunrex-save')||'{}'))}catch(e){return d}})();
const persist=()=>{try{localStorage.setItem('gunrex-save',JSON.stringify(save))}catch(e){}};
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if(!save.comp1){save.comp1=1;save.bank+=100;persist()}
const G=()=>GUNS[save.gun]||GUNS[0];
const SKINS=[
{n:'CLASSIC',price:0,col:null,hat:0,d:'THE ORIGINAL REX'},
{n:'LAVA REX',price:50,col:'#ff6b2b',hat:0,d:'HOT ORANGE SCALES'},
{n:'TOXIC REX',price:50,col:'#7dff8a',hat:0,d:'GLOWING TOXIC GREEN'},
{n:'COWBOY',price:100,col:'#c98b4f',hat:1,d:'YEEHAW. COMES WITH A HAT'},
{n:'NINJA',price:150,col:'#3d3d5c',hat:4,d:'SILENT AND DEADLY'},
{n:'COOL REX',price:150,col:'#4cc9f0',hat:5,d:'TOO COOL FOR BULLETS'},
{n:'ROYAL',price:250,col:'#ffd166',hat:2,d:'FIT FOR A KING'},
{n:'ASTRONAUT',price:350,col:'#eaf6ff',hat:3,d:'READY FOR OUTER SPACE'}];
const PETS=[
{n:'NO PET',price:0,d:'RUNNING SOLO'},
{n:'BABY REX',price:80,mag:90,d:'RUNS BEHIND YOU. GRABS NEARBY COINS'},
{n:'PTERO',price:180,fly:1,mag:60,cool:1.8,dmg:1,pier:0,bc:'#ffd166',d:'FLIES ABOVE. GRABS COINS, SHOOTS NOW AND THEN'},
{n:'ROBO BUDDY',price:350,fly:1,cool:.9,dmg:1,pier:0,bc:'#9bf6ff',d:'DRONE THAT AUTO-SHOOTS ENEMIES AND SHOTS'},
{n:'BABY DRAGON',price:600,fly:1,mag:50,cool:1.1,dmg:2,pier:1,bc:'#ff9f1c',d:'PIERCING FIREBALLS. GRABS COINS'}];
let pet={x:20,y:300,air:0,cd:1,t:0};
function placePet(dt){const q=PETS[save.pet||0];if(!q||!save.pet||!p)return;
 pet.t+=dt;const air=Math.min(0,p.y-gy(p.x+20));pet.air+=(air-pet.air)*Math.min(1,dt*7);
 if(q.fly){pet.x=p.x-30+Math.sin(pet.t*2)*6;pet.y=gy(pet.x+10)-80+pet.air*.5+Math.sin(pet.t*3)*5}
 else{pet.x=p.x-50;pet.y=gy(pet.x+10)+pet.air}}
function updPet(dt){const q=PETS[save.pet||0];if(!q||!save.pet)return;
 if(q.mag)for(const c of coins){if(!c.d&&Math.hypot(c.x-(pet.x+12),c.y-(pet.y-10))<q.mag){c.d=1;coinCount++;save.bank++;persist();dist+=100;snd(880,.1,'triangle');buzz(5)}}
 pet.cd-=dt;
 if(q.cool&&pet.cd<=0){const tg=(boss&&boss.state==='fight')||obs.some(o=>!o.dead&&o.x>pet.x+40&&o.x<W-10);
  if(tg){const bx=pet.x+28,by=pet.y-(q.fly?8:12);bullets.push({x:bx,y:by,off:gy(bx)-by,to:38,dmg:q.dmg,pier:q.pier||0,v:760,life:1.6,col:q.bc});pet.cd=q.cool;snd(520,.05,'square',.03)}else pet.cd=.2}}
function drawPet(){const k=save.pet||0;if(!k)return;const x=Math.round(pet.x),y=Math.round(pet.y),st=Math.floor(p.run)%2,fl=Math.floor(performance.now()/130)%2;
 if(k===1){g.fillStyle='#7dff8a';rect(x,y-14,18,10);rect(x+12,y-24,14,12);rect(x-7,y-12,8,5);rect(x+3,y-4,4,4-(st?2:0));rect(x+11,y-4,4,4-(st?0:2));
  g.fillStyle='#c8ffd0';rect(x+4,y-8,10,4);g.fillStyle='#ffd166';rect(x+4,y-17,3,3);rect(x+10,y-17,3,3);g.fillStyle='#14122b';rect(x+21,y-21,3,3)}
 else if(k===2){g.fillStyle='#e76f51';g.beginPath();g.moveTo(x+4,y-4);g.lineTo(x-6,fl?y-20:y+10);g.lineTo(x+16,y-4);g.fill();
  g.fillStyle='#ff9f1c';rect(x,y-8,18,8);rect(x+14,y-14,12,8);rect(x+10,y-17,6,4);g.fillStyle='#ffd166';rect(x+24,y-10,8,3);g.fillStyle='#14122b';rect(x+20,y-12,3,3)}
 else if(k===3){g.fillStyle='#8d99ae';rect(x,y-12,20,14);g.fillStyle='#14122b';rect(x+3,y-9,14,8);g.fillStyle='#5cf2ff';rect(x+5,y-7,4,4);rect(x+12,y-7,4,4);
  g.fillStyle='#8d99ae';rect(x+9,y-18,2,6);g.fillStyle='#ff6b5b';rect(x+8,y-22,4,4);g.fillStyle='#ffd166';rect(x+6,y+2,8,3+(fl?3:0));rect(x+20,y-6,8,4)}
 else{g.fillStyle='#9d1f2a';g.beginPath();g.moveTo(x+4,y-6);g.lineTo(x-4,fl?y-22:y+8);g.lineTo(x+16,y-6);g.fill();
  g.fillStyle='#e63946';rect(x,y-8,18,10);rect(x+14,y-16,12,10);rect(x-8,y-4,10,4);g.fillStyle='#ffd166';rect(x+16,y-20,3,5);rect(x+22,y-20,3,5);
  g.fillStyle='#14122b';rect(x+21,y-13,3,3);if(pet.cd<.25){g.fillStyle='#ff9f1c';rect(x+26,y-12,9,5)}}}
function drawHat(){const h=(SKINS[save.skin]||SKINS[0]).hat;if(!h)return;const dk=p.duck&&p.on,x=p.x,hw=dk?18:20,hx=dk?x+34:x+22,hy=p.y-(dk?30:46)-(armor>0?2:0);
 if(h===1){g.fillStyle='#6b4226';rect(hx-5,hy-3,hw+10,3);g.fillStyle='#8a5a2b';rect(hx+3,hy-11,hw-6,9);g.fillStyle='#ffd166';rect(hx+3,hy-5,hw-6,2)}
 else if(h===2){g.fillStyle='#ffd166';rect(hx+1,hy-6,hw-2,6);rect(hx+1,hy-12,4,6);rect(hx+hw/2-2,hy-14,4,8);rect(hx+hw-5,hy-12,4,6);g.fillStyle='#e63946';rect(hx+hw/2-1,hy-4,3,3)}
 else if(h===3){g.fillStyle='rgba(180,230,255,.4)';rect(hx-3,hy-5,hw+6,(dk?14:18)+9);g.strokeStyle='#eaf6ff';g.lineWidth=2;g.strokeRect(hx-3,hy-5,hw+6,(dk?14:18)+9)}
 else if(h===4){g.fillStyle='#e63946';rect(hx,hy+3,hw,4);rect(hx-9,hy+4+(Math.floor(performance.now()/120)%2),9,3)}
 else if(h===5){g.fillStyle='#14122b';rect(hx+hw-14,hy+(dk?2:4),14,5);g.fillStyle='#fff';rect(hx+hw-12,hy+(dk?3:5),3,2)}}
const A=()=>ARMORS[save.armor]||ARMORS[0];
let shopOpen=false,shopMsg='';
const BIO=[
{n:'DESERT',shape:0,m:1,l1:190,l2:80,day:{top:'#ffcf91',bot:'#fff0d2',far:'#f0b27a',near:'#d98e5a',gnd:'#7a4a2b',ink:'#2b2d42'},night:{top:'#15143a',bot:'#4a3a7a',far:'#2e2759',near:'#241e49',gnd:'#100e26',ink:'#ffefd0'}},
{n:'JUNGLE',shape:1,m:1.15,l1:210,l2:95,fx:1,fxc:'rgba(160,230,120,.85)',fxv:25,day:{top:'#9fe3b5',bot:'#eafbe4',far:'#5fb37c',near:'#2f8f5b',gnd:'#35502f',ink:'#10281c'},night:{top:'#0b1d2a',bot:'#1f4a47',far:'#1c4a45',near:'#14352f',gnd:'#0b1a17',ink:'#d8ffe6'}},
{n:'TUNDRA',shape:2,m:.95,l1:260,l2:110,fx:1,fxc:'rgba(255,255,255,.95)',fxv:45,day:{top:'#bfe4ff',bot:'#f4fbff',far:'#9bbfe0',near:'#7fa3c9',gnd:'#dfeaf5',ink:'#1d3557'},night:{top:'#0a1030',bot:'#2b3d6e',far:'#2a3a66',near:'#22305a',gnd:'#566a99',ink:'#eaf4ff'}},
{n:'VOLCANO',shape:3,m:1.1,l1:200,l2:85,fx:1,fxc:'rgba(255,154,60,.9)',fxv:-55,day:{top:'#ff9a76',bot:'#ffd9a8',far:'#a8423a',near:'#7a2e2e',gnd:'#5a2c25',ink:'#2b1320'},night:{top:'#1a0508',bot:'#5a1a1a',far:'#4a1414',near:'#3a0f10',gnd:'#1a0707',ink:'#ffe9d0'}},
{n:'OUTER SPACE',shape:4,m:.9,l1:230,l2:100,fx:1,fxc:'rgba(200,230,255,.9)',fxv:6,day:{top:'#0b0630',bot:'#2a1a6e',far:'#4b2d8a',near:'#33206b',gnd:'#4a4a6a',ink:'#d6f5ff'},night:{top:'#05031a',bot:'#150d4a',far:'#2f1c63',near:'#20134a',gnd:'#2a2a45',ink:'#bff6ff'}}
];
const hv=(P,u)=>{const A=Math.min(26+wx*.006,90)*P.m;return A*(.5+.32*Math.sin(u/P.l1)+.18*Math.sin(u/P.l2+1.3))};
const hill=u=>{const t=Math.max(0,Math.min(1,(u-seamU)/320)),s=t*t*(3-2*t);return hv(hOld,u)*(1-s)+hv(hNew,u)*s};
const gy=sx=>GY-hill(wx+sx);
let hOld,hNew,seamU=0,biome=0,prevB=0,bfade=1,zn=0,znm='',boss=null,bossLvl=0,nextBoss=15000,warn=0,bmsg='',wx=0,bullets=[],ebul=[],parts=[],ammo=6,cool=0,kills=0,S='ready',spd,dist,nd,obs,coins,orbs,clouds,shield,armor=0,p,shake,flash,coinCount,last=0,overAt=0,hi=0,msg='';
try{hi=+localStorage.getItem('rexrun-hi')||0}catch(e){}
const rnd=(a,b)=>a+Math.random()*(b-a);
const hex=c=>[1,3,5].map(i=>parseInt(c.substr(i,2),16));
const mix=(a,b,t)=>'rgb('+hex(a).map((v,i)=>Math.round(v+(hex(b)[i]-v)*t)).join(',')+')';
const DAY={top:'#ffcf91',bot:'#fff0d2',far:'#f0b27a',near:'#d98e5a',gnd:'#7a4a2b',ink:'#2b2d42'};
const NIGHT={top:'#15143a',bot:'#4a3a7a',far:'#2e2759',near:'#241e49',gnd:'#100e26',ink:'#ffefd0'};
const BOULDER=.2; // boulder speed multiplier (was .5, lower = slower, easier to dodge)
const ATKD=1.5; // enemy attack delay multiplier (1 = old speed, higher = slower attacks)
let AC;function snd(f,d,type,v){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),a=AC.createGain();
o.type=type||'square';o.frequency.setValueAtTime(f,AC.currentTime);o.frequency.exponentialRampToValueAtTime(f*1.6,AC.currentTime+d);
a.gain.setValueAtTime(v||.05,AC.currentTime);a.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(a);a.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const buzz=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
let musMuted=false;try{musMuted=localStorage.getItem('gunrex-mute')==='1'}catch(e){}
const MUS=(()=>{
 const N=m=>440*Math.pow(2,(m-69)/12),prog=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]],bass=[45,41,36,43],arp=[0,1,2,1,2,1,0,2],STEP=60/150/2;
 let g=null,tm=0,st=0,iv=null,run=false;
 function note(f,t,d,type,v){const o=AC.createOscillator(),a=AC.createGain();o.type=type;o.frequency.value=f;a.gain.setValueAtTime(.0001,t);a.gain.linearRampToValueAtTime(v,t+.01);a.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(a);a.connect(g);o.start(t);o.stop(t+d+.03)}
 function sched(){try{while(tm<AC.currentTime+.4){const bar=Math.floor(st/8)%4,i=st%8,ch=prog[bar],hi=Math.floor(st/32)%2?12:0;
  note(N(ch[arp[i]]+12+hi),tm,.17,'square',.8);
  if(i%2===0)note(N(bass[bar]),tm,.36,'triangle',1.6);
  if(i===0||i===4)note(N(ch[0]+24),tm,.1,'square',.25);
  tm+=STEP;st++}}catch(e){}}
 function start(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
  if(!g){g=AC.createGain();g.connect(AC.destination)}
  g.gain.cancelScheduledValues(AC.currentTime);g.gain.setValueAtTime(.045,AC.currentTime);tm=AC.currentTime+.05;iv=setInterval(sched,100);run=true}catch(e){}}
 function stop(){try{clearInterval(iv);run=false;if(g){g.gain.cancelScheduledValues(AC.currentTime);g.gain.setTargetAtTime(0,AC.currentTime,.05)}}catch(e){}}
 return{set(on){if(on&&!musMuted&&!run)start();else if((!on||musMuted)&&run)stop()}}
})();
const toggleMusic=()=>{musMuted=!musMuted;try{localStorage.setItem('gunrex-mute',musMuted?'1':'0')}catch(e){}};
