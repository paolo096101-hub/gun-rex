function toggleFS(){try{const d=document,e=d.documentElement,on=d.fullscreenElement||d.webkitFullscreenElement,r=on?(d.exitFullscreen||d.webkitExitFullscreen).call(d):(e.requestFullscreen||e.webkitRequestFullscreen).call(e);if(r&&r.catch)r.catch(()=>{})}catch(x){}}
document.getElementById('play').addEventListener('click',()=>{startGame();if(!document.fullscreenElement&&!document.webkitFullscreenElement)toggleFS()});
document.getElementById('lfs').addEventListener('click',toggleFS);
const setEl=document.getElementById('set');
function applySet(){const t=save.set,r=document.documentElement.style;r.setProperty('--bs',[.8,1,1.25][t.bs]||1);r.setProperty('--bb',t.bh?'48px':'10px');document.body.classList.toggle('swap',!!t.bp)}
function renderSet(){const t=save.set,o=(lab,key,opts,cur)=>'<div class="opt"><span>'+lab+'</span><span class="sg">'+opts.map((x,i)=>'<button class="sb'+(cur===i?' on':'')+'" data-k="'+key+'" data-v="'+i+'">'+x+'</button>').join('')+'</span></div>';
 setEl.innerHTML='<div class="sc"><div class="st">SETTINGS</div>'+o('SOUND FX','sfx',['OFF','ON'],t.sfx?1:0)+o('MUSIC','mus',['OFF','ON'],musMuted?0:1)+o('SCREEN SHAKE','shk',['OFF','ON'],t.shk?1:0)+o('BUTTON SIZE','bs',['S','M','L'],t.bs)+o('BUTTON LAYOUT','bp',['NORMAL','SWAP'],t.bp?1:0)+o('BUTTON HEIGHT','bh',['LOW','HIGH'],t.bh?1:0)+'<button class="sb on" id="sclose" style="width:100%;margin-top:8px">DONE</button></div>'}
function openSet(){setEl.classList.add('open');document.body.classList.add('setopen');renderSet()}
function closeSet(){setEl.classList.remove('open');document.body.classList.remove('setopen')}
setEl.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button');if(!b)return;if(b.id==='sclose'){closeSet();return}const k=b.dataset.k,v=+b.dataset.v;if(k==='mus'){if(musMuted===!!v)toggleMusic()}else{save.set[k]=v;persist();applySet()}renderSet();if(k==='sfx'&&v)snd(660,.08)});
applySet();
document.getElementById('lshop').addEventListener('click',()=>sbtn.click());
lmu.addEventListener('click',openSet);
mbtn.addEventListener('click',goLobby);
function loop(ts){MUS.set(S==='play'&&!document.hidden);sbtn.classList.toggle('show',S==='over');mbtn.classList.toggle('show',S==='over');document.body.classList.toggle('lobby',S==='lobby');if(S==='lobby')lobbyUI();const dt=Math.min((ts-last)/1000||0,.033);last=ts;if(gst)gstep(dt);else if(S==='play')update(dt);else{if(S==='lobby')updLobby(dt);shake*=.9;flash*=.9}placePet(dt);netTick(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

const shopEl=document.getElementById('shop');
let shopTab='guns';
const TABS=[['guns','GUNS'],['armor','ARMOR'],['skins','SKINS'],['pets','PETS'],['more','MORE']];
const rcol=pr=>pr<=0?'#9aa5b1':pr<=100?'#7dff8a':pr<=250?'#6ec6ff':pr<=500?'#c77dff':'#ffd166';
const bar=(l,v)=>'<div class="sb"><span>'+l+'</span><i><u style="width:'+Math.round(Math.max(.06,Math.min(1,v))*100)+'%"></u></i></div>';
const ibtn=(key,i,own,eq,price)=>eq?'<button class="eqb" disabled>EQUIPPED</button>':own?'<button class="own" data-'+key+'="'+i+'">EQUIP</button>':'<button class="'+(save.bank>=price?'':'cant')+'" data-'+key+'="'+i+'"><i class="cn"></i>'+price+'</button>';
const icard=o=>'<div class="it'+(o.eq?' eq':'')+'" style="--rc:'+rcol(o.price)+'"><img class="pv" src="'+o.im+'"><div class="ib"><b>'+o.n+'</b>'+o.body+ibtn(o.key,o.i,o.own,o.eq,o.price)+'</div></div>';
const gunBody=q=>{const t=[q.pier>=99?'PIERCES ALL':q.pier>0?'PIERCES '+q.pier:'',q.pel>1?q.pel+' PELLETS':'',q.life<1?'MEDIUM RANGE':''].filter(Boolean).join(' | ');return bar('DMG',q.dmg*q.pel/8)+bar('RATE',1/q.cool/14)+bar('AMMO',q.max/14)+(t?'<small>'+t+'</small>':'')};
const armBody=a=>(a.hits?'<div class="pips">'+'<i class="f"></i>'.repeat(a.hits)+'</div>':'')+'<small>'+a.d+'</small>';
const skinBody=k=>{const P=gpal(GUNS[save.gun]||GUNS[0],k);return '<div class="dots">GUN STYLE <i style="background:'+P.m+'"></i><i style="background:'+P.a+'"></i><i style="background:'+P.gl+'"></i></div><small>'+k.d+'</small>'};
const petBody=k=>{const t=[k.fly?'FLIES':'',k.mag?'COLLECTS COINS':'',k.cool?'SHOOTS':''].filter(Boolean).join(' | ');return (t?'<div class="dots">'+t+'</div>':'')+'<small>'+k.d+'</small>'};
function petPreview(k){const key='pet'+k;if(pvCache[key])return pvCache[key];
 const c=document.createElement('canvas');c.width=96;c.height=70;const og=g,sp=save.pet,op=pet;g=c.getContext('2d');
 try{g.fillStyle='#ffcf91';g.fillRect(0,0,96,70);g.fillStyle='#d98e5a';g.fillRect(0,52,96,8);g.fillStyle='#7a4a2b';g.fillRect(0,60,96,10);
  if(k){save.pet=k;pet={x:32,y:56,air:0,cd:1,t:0};drawPet()}}
 catch(e){}finally{g=og;save.pet=sp;pet=op}
 return pvCache[key]=c.toDataURL()}
function loadoutImg(){const sk=SKINS[save.skin]||SKINS[0],gi=GUNS[save.gun]?save.gun:0,ai=save.armor||0,pk=save.pet||0,key='lo'+save.skin+'_'+gi+'_'+ai+'_'+pk;if(pvCache[key])return pvCache[key];
 const c=document.createElement('canvas');c.width=150;c.height=72;const og=g,sp=save.pet,op=pet;g=c.getContext('2d');
 try{g.fillStyle='#ffcf91';g.fillRect(0,0,150,72);g.fillStyle='#d98e5a';g.fillRect(0,54,150,8);g.fillStyle='#7a4a2b';g.fillRect(0,62,150,10);
  if(pk){const q=PETS[pk];save.pet=pk;pet={x:6,y:q&&q.fly?30:62,air:0,cd:1,t:0};drawPet()}
  drawRexAt(64,62,{col:sk.col||'#2b2d42',sk,gq:gi,duck:0,air:false,step:0,t:1000,arm:ai>0,armCol:(ARMORS[ai]||ARMORS[0]).col,shield:0,fire:0});drawHatAt(64,62,false,sk,ai>0)}
 catch(e){}finally{g=og;save.pet=sp;pet=op}
 return pvCache[key]=c.toDataURL()}
function renderShop(){const gs=shopEl.querySelector('.sgrid'),st=gs?gs.scrollTop:0;let items='';
 if(shopTab==='guns')items=GUNS.map((q,i)=>icard({n:q.n,price:q.price,im:rexPreview(save.skin,i,0),body:gunBody(q),key:'i',i,own:save.own[i],eq:save.gun===i})).join('');
 else if(shopTab==='armor')items=ARMORS.map((a,i)=>icard({n:a.n,price:a.price,im:rexPreview(save.skin,save.gun,i),body:armBody(a),key:'a',i,own:save.aown[i],eq:save.armor===i})).join('');
 else if(shopTab==='skins')items=SKINS.map((k,i)=>icard({n:k.n,price:k.price,im:rexPreview(i,save.gun,0),body:skinBody(k),key:'s',i,own:save.sown[i],eq:save.skin===i})).join('');
 else if(shopTab==='pets')items=PETS.map((k,i)=>icard({n:k.n,price:k.price,im:petPreview(i),body:petBody(k),key:'p',i,own:save.pown[i],eq:(save.pet||0)===i})).join('');
 else items='<div class="more"><div class="sec">SOUND</div><div class="row"><button id="mus">MUSIC: '+(musMuted?'OFF':'ON')+'</button></div><div class="sec">SAVE CODE</div><div class="gm" style="color:#ffefd0">COPY YOUR CODE TO BACK UP OR MOVE TO ANOTHER DEVICE</div><textarea id="code" placeholder="PASTE CODE HERE TO IMPORT" spellcheck="false"></textarea><div class="row"><button id="exp">EXPORT</button><button id="imp">IMPORT</button></div></div>';
 const ln=(a,b)=>'<div class="ln"><span>'+a+'</span><b>'+b+'</b></div>';
 const ok=/^(BOUGHT|EQUIPPED|CODE|SAVE)/.test(shopMsg);
 shopEl.innerHTML='<div class="sh"><span class="tt">SHOP</span><span class="coins"><i class="cn"></i>'+save.bank+'</span><button class="shx" id="sx">CLOSE</button></div>'
  +'<div class="tabs">'+TABS.map(t=>'<button data-tab="'+t[0]+'"'+(shopTab===t[0]?' class="on"':'')+'>'+t[1]+'</button>').join('')+'</div>'
  +'<div class="smain"><div class="sside"><img src="'+loadoutImg()+'">'+ln('GUN',(GUNS[save.gun]||GUNS[0]).n)+ln('SKIN',(SKINS[save.skin]||SKINS[0]).n)+ln('ARMOR',(ARMORS[save.armor]||ARMORS[0]).n)+ln('PET',(PETS[save.pet||0]||PETS[0]).n)+'</div><div class="sgrid">'+items+'</div></div>'
  +(shopMsg?'<div class="toast'+(ok?' ok':'')+'">'+shopMsg+'</div>':'');
 const g2=shopEl.querySelector('.sgrid');if(g2)g2.scrollTop=st;shopMsg=''}
const SH={i:{L:GUNS,o:'own',s:'gun',on:q=>{ammo=q.max}},a:{L:ARMORS,o:'aown',s:'armor'},s:{L:SKINS,o:'sown',s:'skin'},p:{L:PETS,o:'pown',s:'pet'}};
shopEl.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.tab){shopTab=b.dataset.tab;snd(500,.04,'square',.03);renderShop();const gg=shopEl.querySelector('.sgrid');if(gg)gg.scrollTop=0;return}
 if(b.id==='mus'){toggleMusic();renderShop();return}
 if(b.id==='exp'){const t=btoa(JSON.stringify({s:save,h:hi})),ta=document.getElementById('code');ta.value=t;ta.focus();ta.select();let ok=0;try{navigator.clipboard.writeText(t).then(()=>{shopMsg='CODE COPIED';renderShop();document.getElementById('code').value=t}).catch(()=>{})}catch(x){}return}
 if(b.id==='imp'){const t=document.getElementById('code').value.trim();try{const o=JSON.parse(atob(t));if(!o||!o.s||typeof o.s.bank!=='number')throw 0;Object.assign(save,o.s);if(+o.h>hi){hi=+o.h;try{localStorage.setItem('rexrun-hi',hi)}catch(x){}}persist();shopMsg='SAVE LOADED';snd(660,.2,'triangle',.08)}catch(x){shopMsg='INVALID CODE';snd(110,.15,'square',.05)}renderShop();return}
 if(b.id==='sx'){shopOpen=false;shopEl.classList.remove('open');return}
 const key=['i','a','s','p'].find(k=>b.dataset[k]!==undefined);if(!key)return;
 const X=SH[key],j=+b.dataset[key],it=X.L[j];
 if(!save[X.o][j]){if(save.bank>=it.price){save.bank-=it.price;save[X.o][j]=1;save[X.s]=j;if(X.on)X.on(it);persist();snd(660,.2,'triangle',.08);buzz(20);shopMsg='BOUGHT '+it.n}else{shopMsg='NOT ENOUGH COINS';snd(110,.15,'square',.05)}}
 else{save[X.s]=j;if(X.on)X.on(it);persist();snd(440,.08,'triangle',.06);shopMsg='EQUIPPED '+it.n}
 renderShop()});
document.getElementById('shopbtn').addEventListener('click',()=>{if(S==='play')S='pause';shopOpen=true;shopMsg='';renderShop();shopEl.classList.add('open')});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
